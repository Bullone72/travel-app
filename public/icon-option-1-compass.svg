<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d9488"/>
      <stop offset="100%" style="stop-color:#134e4a"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="22" fill="url(#bg)"/>
  <!-- compass ring -->
  <circle cx="50" cy="50" r="32" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1.5"/>
  <circle cx="50" cy="50" r="28" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="0.8"/>
  <!-- tick marks -->
  <line x1="50" y1="20" x2="50" y2="26" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="50" y1="74" x2="50" y2="80" stroke="rgba(255,255,255,0.5)" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="20" y1="50" x2="26" y2="50" stroke="rgba(255,255,255,0.5)" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="74" y1="50" x2="80" y2="50" stroke="rgba(255,255,255,0.5)" stroke-width="1.5" stroke-linecap="round"/>
  <!-- compass needle north (red/white) -->
  <polygon points="50,28 46,50 50,48" fill="#f87171"/>
  <polygon points="50,28 54,50 50,48" fill="#fca5a5"/>
  <!-- compass needle south -->
  <polygon points="50,72 46,50 50,52" fill="rgba(255,255,255,0.7)"/>
  <polygon points="50,72 54,50 50,52" fill="rgba(255,255,255,0.4)"/>
  <!-- center dot -->
  <circle cx="50" cy="50" r="3" fill="#fff"/>
  <circle cx="50" cy="50" r="1.5" fill="#134e4a"/>
  <!-- N label -->
  <text x="50" y="17" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="7" font-weight="bold">N</text>
</svg>
