<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f97316"/>
      <stop offset="100%" style="stop-color:#dc2626"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="22" fill="url(#bg)"/>
  <!-- suitcase body -->
  <rect x="25" y="35" width="50" height="35" rx="6" fill="none" stroke="#fff" stroke-width="3"/>
  <!-- handle -->
  <path d="M 40 35 L 40 28 Q 40 24 44 24 L 56 24 Q 60 24 60 28 L 60 35" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- belt -->
  <line x1="25" y1="50" x2="75" y2="50" stroke="#fff" stroke-width="2"/>
  <rect x="44" y="46" width="12" height="8" rx="2" fill="#fff" fill-opacity="0.9"/>
  <!-- stickers -->
  <circle cx="35" cy="60" r="4" fill="#fde68a" fill-opacity="0.8"/>
  <circle cx="65" cy="60" r="3.5" fill="#a5f3fc" fill-opacity="0.8"/>
  <circle cx="50" cy="40" r="3" fill="#d9f99d" fill-opacity="0.8"/>
  <!-- wheels -->
  <circle cx="35" cy="73" r="3" fill="#fff" fill-opacity="0.8"/>
  <circle cx="65" cy="73" r="3" fill="#fff" fill-opacity="0.8"/>
</svg>
