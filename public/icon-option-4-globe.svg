<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0891b2"/>
      <stop offset="100%" style="stop-color:#164e63"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="22" fill="url(#bg)"/>
  <!-- globe -->
  <circle cx="50" cy="50" r="30" fill="none" stroke="#fff" stroke-width="2" opacity="0.3"/>
  <!-- meridians -->
  <ellipse cx="50" cy="50" rx="15" ry="30" fill="none" stroke="#fff" stroke-width="1.2" opacity="0.25"/>
  <ellipse cx="50" cy="50" rx="25" ry="30" fill="none" stroke="#fff" stroke-width="1" opacity="0.15"/>
  <!-- equator + tropics -->
  <ellipse cx="50" cy="50" rx="30" ry="8" fill="none" stroke="#fff" stroke-width="1.2" opacity="0.25"/>
  <ellipse cx="50" cy="42" rx="28" ry="6" fill="none" stroke="#fff" stroke-width="0.8" opacity="0.15"/>
  <ellipse cx="50" cy="58" rx="28" ry="6" fill="none" stroke="#fff" stroke-width="0.8" opacity="0.15"/>
  <!-- continents (abstract blobs) -->
  <ellipse cx="42" cy="40" rx="10" ry="8" fill="#34d399" opacity="0.5" transform="rotate(-15 42 40)"/>
  <ellipse cx="58" cy="55" rx="8" ry="6" fill="#34d399" opacity="0.4" transform="rotate(10 58 55)"/>
  <ellipse cx="45" cy="60" rx="6" ry="5" fill="#34d399" opacity="0.35"/>
  <!-- travel path -->
  <path d="M 32 38 Q 45 28 62 45" fill="none" stroke="#fde68a" stroke-width="2" stroke-dasharray="3 2" opacity="0.9"/>
  <!-- plane dot on path -->
  <circle cx="48" cy="33" r="3" fill="#fde68a"/>
  <!-- pin at destination -->
  <g transform="translate(62,45)">
    <circle cx="0" cy="0" r="4" fill="#f87171"/>
    <circle cx="0" cy="0" r="2" fill="#fff"/>
    <line x1="0" y1="4" x2="0" y2="10" stroke="#f87171" stroke-width="2"/>
  </g>
</svg>
