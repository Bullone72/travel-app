name: Deploy a Vercel

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configura git author
        run: |
          git config user.name "Alessandro"
          git config user.email "alessandro.nullo@etik.com"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Installa dipendenze
        run: npm ci

      - name: Build
        run: npm run build

      - name: Build output Vercel
        run: npx vercel build --prod --yes

      - name: Deploy a Vercel
        run: npx vercel deploy --prod --prebuilt --token ${{ secrets.VERCEL_TOKEN }}
